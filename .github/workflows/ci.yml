# CI of the Deproi repository itself (not the deploy workflow that projects use).
#
# First-party actions only, pinned to a commit SHA (tag in the comment).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs parity (en ↔ pt-BR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/check_docs_parity.py

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the oldest supported server Python (Ubuntu 22.04's /usr/bin/python3).
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - name: deproi.py compiles on this Python
        run: |
          if [ -f deproi.py ]; then python -m py_compile deproi.py; else echo "deproi.py not created yet"; fi
      - run: pytest

  workflows:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint this repository's workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: Lint the rendered workflow templates
        run: |
          work=$(mktemp -d)
          mkdir -p "$work/.github/workflows"
          scripts/render-workflow.sh deploy --name myapp-prod --branch main --environment production \
            > "$work/.github/workflows/deploy-production.yml"
          scripts/render-workflow.sh update > "$work/.github/workflows/deproi-update.yml"
          chmod -R a+rX "$work"
          # Files passed explicitly: actionlint then needs no git repository.
          docker run --rm -v "$work:/repo" -w /repo rhysd/actionlint:1.7.12 -color \
            .github/workflows/deploy-production.yml .github/workflows/deproi-update.yml

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint shell scripts
        # shellcheck is preinstalled on the ubuntu-latest runner.
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          if [ "${#scripts[@]}" -eq 0 ]; then echo "no shell scripts yet"; exit 0; fi
          shellcheck "${scripts[@]}"
