<rect class="n0" x="24.0" y="92" width="128" height="76" rx="12" stroke-width="2"/>
<circle cx="42.0" cy="110" r="10" fill="var(--edge)"/><text x="42.0" y="114" text-anchor="middle" font-size="11" font-weight="700">1</text>
<text class="label" x="88.0" y="138" text-anchor="middle">git push</text>
<text class="sub" x="88.0" y="156" text-anchor="middle">branch de deploy</text>
<rect class="n1" x="168.0" y="92" width="128" height="76" rx="12" stroke-width="2"/>
<circle cx="186.0" cy="110" r="10" fill="var(--edge)"/><text x="186.0" y="114" text-anchor="middle" font-size="11" font-weight="700">2</text>
<text class="label" x="232.0" y="138" text-anchor="middle">GitHub Actions</text>
<text class="sub" x="232.0" y="156" text-anchor="middle">abre o SSH, sem lógica</text>
<rect class="n2" x="312.0" y="92" width="128" height="76" rx="12" stroke-width="2"/>
<circle cx="330.0" cy="110" r="10" fill="var(--edge)"/><text x="330.0" y="114" text-anchor="middle" font-size="11" font-weight="700">3</text>
