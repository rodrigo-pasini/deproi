<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 270" width="1040" height="270" role="img" aria-label="Do git push ao ar, no seu próprio servidor">
<title>Do git push ao ar, no seu próprio servidor</title>
<style>
  :root, svg {
    --bg: #ffffff; --ink: #1f2328; --muted: #59636e; --node: #f6f8fa; --edge: #d1d9e0;
    --accent: #0969da; --accent-soft: #ddf4ff; --ok: #1a7f37; --ok-soft: #dafbe1;
    --bad: #cf222e; --bad-soft: #ffebe9;
  }
  @media (prefers-color-scheme: dark) {
    :root, svg {
      --bg: #0d1117; --ink: #e6edf3; --muted: #9198a1; --node: #151b23; --edge: #3d444d;
      --accent: #4493f8; --accent-soft: #0c2d6b; --ok: #3fb950; --ok-soft: #0f3a1e;
      --bad: #f85149; --bad-soft: #4c1414;
    }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: var(--ink); }
  .bg { fill: var(--bg); }
  .title { font-size: 20px; font-weight: 600; }
  .caption { font-size: 13px; fill: var(--muted); }
  .label { font-size: 14px; font-weight: 600; }
  .sub { font-size: 11.5px; fill: var(--muted); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .edge { stroke: var(--edge); stroke-width: 2; fill: none; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
@keyframes n0 { 0%, 4.00% { fill: var(--node); stroke: var(--edge); } 6.50%, 88% { fill: var(--accent-soft); stroke: var(--accent); } 96%, 100% { fill: var(--node); stroke: var(--edge); } }
.n0 { animation: n0 10s ease-in-out infinite; }
@keyframes n1 { 0%, 14.50% { fill: var(--node); stroke: var(--edge); } 17.00%, 88% { fill: var(--accent-soft); stroke: var(--accent); } 96%, 100% { fill: var(--node); stroke: var(--edge); } }
.n1 { animation: n1 10s ease-in-out infinite; }
@keyframes n2 { 0%, 25.00% { fill: var(--node); stroke: var(--edge); } 27.50%, 88% { fill: var(--accent-soft); stroke: var(--accent); } 96%, 100% { fill: var(--node); stroke: var(--edge); } }
.n2 { animation: n2 10s ease-in-out infinite; }
@keyframes n3 { 0%, 35.50% { fill: var(--node); stroke: var(--edge); } 38.00%, 88% { fill: var(--accent-soft); stroke: var(--accent); } 96%, 100% { fill: var(--node); stroke: var(--edge); } }
.n3 { animation: n3 10s ease-in-out infinite; }
@keyframes n4 { 0%, 46.00% { fill: var(--node); stroke: var(--edge); } 48.50%, 88% { fill: var(--accent-soft); stroke: var(--accent); } 96%, 100% { fill: var(--node); stroke: var(--edge); } }
.n4 { animation: n4 10s ease-in-out infinite; }
@keyframes n5 { 0%, 56.50% { fill: var(--node); stroke: var(--edge); } 59.00%, 88% { fill: var(--accent-soft); stroke: var(--accent); } 96%, 100% { fill: var(--node); stroke: var(--edge); } }
.n5 { animation: n5 10s ease-in-out infinite; }
@keyframes n6 { 0%, 67.00% { fill: var(--node); stroke: var(--edge); } 69.50%, 88% { fill: var(--ok-soft); stroke: var(--ok); } 96%, 100% { fill: var(--node); stroke: var(--edge); } }
.n6 { animation: n6 10s ease-in-out infinite; }
@keyframes packet { 0% { transform: translateX(0); opacity: 0; } 4.00% { transform: translateX(0.0px); opacity: 1; } 14.50% { transform: translateX(144.0px); opacity: 1; } 25.00% { transform: translateX(288.0px); opacity: 1; } 35.50% { transform: translateX(432.0px); opacity: 1; } 46.00% { transform: translateX(576.0px); opacity: 1; } 56.50% { transform: translateX(720.0px); opacity: 1; } 67.00% { transform: translateX(864.0px); opacity: 1; } 88% { opacity: 1; } 92%, 100% { opacity: 0; transform: translateX(864.0px); } }
.packet { animation: packet 10s ease-in-out infinite; }
</style>
