<circle cx="618.0" cy="110" r="10" fill="var(--edge)"/><text x="618.0" y="114" text-anchor="middle" font-size="11" font-weight="700">5</text>
<text class="label" x="664.0" y="138" text-anchor="middle">build + ganchos</text>
<text class="sub" x="664.0" y="156" text-anchor="middle">imagem, migrations</text>
<rect class="n5" x="744.0" y="92" width="128" height="76" rx="12" stroke-width="2"/>
<circle cx="762.0" cy="110" r="10" fill="var(--edge)"/><text x="762.0" y="114" text-anchor="middle" font-size="11" font-weight="700">6</text>
<text class="label" x="808.0" y="138" text-anchor="middle">recriar</text>
<text class="sub" x="808.0" y="156" text-anchor="middle">docker compose up</text>
<rect class="n6" x="888.0" y="92" width="128" height="76" rx="12" stroke-width="2"/>
<circle cx="906.0" cy="110" r="10" fill="var(--edge)"/><text x="906.0" y="114" text-anchor="middle" font-size="11" font-weight="700">7</text>
<text class="label" x="952.0" y="138" text-anchor="middle">saudável?</text>
<text class="sub" x="952.0" y="156" text-anchor="middle">no ar ✓</text>
<circle class="packet" cx="88.0" cy="190" r="6" fill="var(--accent)"/>
<line class="edge" x1="88.0" y1="190" x2="952.0" y2="190" stroke-dasharray="3 6"/>
<text class="caption" x="520.0" y="242" text-anchor="middle">Cada push na branch percorre este caminho. Se a versão nova não fica saudável, ela é revertida sozinha.</text>
