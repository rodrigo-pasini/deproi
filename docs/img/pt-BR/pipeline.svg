<text class="sub" x="376.0" y="156" text-anchor="middle">presa a 1 comando</text>
<rect class="n3" x="456.0" y="92" width="128" height="76" rx="12" stroke-width="2"/>
<circle cx="474.0" cy="110" r="10" fill="var(--edge)"/><text x="474.0" y="114" text-anchor="middle" font-size="11" font-weight="700">4</text>
<text class="label" x="520.0" y="138" text-anchor="middle">sudo deproi</text>
<text class="sub" x="520.0" y="156" text-anchor="middle">root, no servidor</text>
