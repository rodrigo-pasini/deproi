# Tooling configuration only — Deproi is not a Python package.
# deproi.py is a single stdlib-only file that must run on Python 3.10+.

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["PLANO.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF"]
ignore = [
    "E501", # the formatter wraps code; long lines left are message strings
    "S603", # subprocess without shell: deliberate, Deproi never uses a shell
    "S607", # partial executable path (git, docker): resolved by the root PATH on the server
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"] # asserts, fake tokens and fake paths are test data
"tools/build_images.py" = ["RUF001"] # typographic characters in drawings are intended

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools", "."]
addopts = "-ra --strict-markers"
